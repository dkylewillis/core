name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schemas-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.38.2
      - run: sqlite3 --version
      - run: ./scripts/validate.sh
